plugins { id 'java-library' }

group = 'gator.lib'
version = '1.0.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets.main.java.srcDir 'src'
sourceSets.test.java.srcDir 'test'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories { mavenCentral() }

dependencies {
    api 'gator.lib:gator-lib:1.0.0-SNAPSHOT'
    api 'org.apache.shiro:shiro-web:3.0.0'
    compileOnlyApi 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

tasks.named('jar') {
    archiveFileName = 'gator-lib-shiro.jar'
    destinationDirectory = file('dist')
}

tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('clean') { delete 'dist' }

tasks.register('verifyNoSensitiveLogs') {
    def sources = fileTree('src') { include '**/*.java' }
    inputs.files(sources)
    doLast {
        def sensitive = ['new String(password)', 'passwdSalt.password', '"Password: [" + password',
                         'stringSession', 'session.getId()', 'currentUser.getSession(',
                         'gappCookie.getId()', 'jsonShiroIni', 'map.getValue()']
        def violations = []
        sources.each { file ->
            file.eachLine { line, number ->
                if (line.contains('logIt') && sensitive.any { line.contains(it) }) {
                    violations << "${file}:${number}"
                }
            }
        }
        if (violations) throw new GradleException("Sensitive Shiro log detected: ${violations.join(', ')}")
    }
}
tasks.named('check') { dependsOn 'verifyNoSensitiveLogs' }

tasks.register('sessionDaoSelfCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gator.lib.shiro.session.test.GappSessionDAOSelfCheck'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'sessionDaoSelfCheck' }
